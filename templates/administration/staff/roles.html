<form
    method="post"
    action="{% url 'administration:user-roles' staff_user.pk %}">

    {% csrf_token %}

    <div class="card shadow-sm">

        <div class="card-header">

            <strong>

                Access Roles

            </strong>

        </div>

        <div class="card-body">

            {{ role_form.groups }}

        </div>

        <div class="card-footer text-end">

            <button
                class="btn btn-primary">

                <i class="bi bi-check-circle me-1"></i>

                Save Roles

            </button>

        </div>

    </div>

</form>
