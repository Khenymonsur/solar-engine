<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        Cloud Energy
        {% endblock %}
    </title>
</head>

<body style="
    margin: 0;
    padding: 0;
    background-color: #F7F9FA;
    font-family: Arial, Helvetica, sans-serif;
    color: #1A1A1A;
">

<table
    role="presentation"
    width="100%"
    style="
            background-color: #F7F9FA;
            width: 100%;
            max-width: 600px;
            table-layout: fixed;
    "
>
    <tr>
        <td
            align="center"
            style="padding: 40px 16px;"
        >

            <table
                role="presentation"
                width="100%"
                style="
                    width: 100%;
                    max-width: 600px;
                    background-color: #FFFFFF;
                    border: 1px solid #E5E7EB;
                    border-radius: 12px;
                    overflow: hidden;
                "
            >

                <!-- Header -->
                <tr>
                    <td
                        align="center"
                        style="
                            padding: 30px;
                            border-bottom: 4px solid #0098DA;
                        "
                    >

                        {% if logo_url %}

                            <img
                                src="{{ logo_url }}"
                                alt="Cloud Energy"
                                width="180"
                                style="
                                    display: block;
                                    max-width: 180px;
                                    height: auto;
                                    border: 0;
                                "
                            >

                        {% endif %}

                    </td>
                </tr>


                <!-- Main Content -->
                <tr>
                    <td
                        style="
                            padding: 32px 24px 28px;
                        "
                    >

                        {% block content %}
                        {% endblock %}

                    </td>
                </tr>


                <!-- Footer -->
                <tr>
                    <td
                        align="center"
                        style="
                            padding: 28px 30px;
                            background-color: #101828;
                            color: #FFFFFF;
                        "
                    >

                        <p
                            style="
                                margin: 0 0 8px;
                                font-size: 14px;
                                font-weight: bold;
                            "
                        >
                            Cloud Energy Photoelectric Ltd
                        </p>

                        <p
                            style="
                                margin: 0;
                                font-size: 12px;
                                line-height: 20px;
                                color: #D0D5DD;
                            "
                        >
                            Smart energy solutions for a sustainable future.
                        </p>

                        <p
                            style="
                                margin: 12px 0 0;
                                font-size: 11px;
                                line-height: 18px;
                                color: #98A2B3;
                            "
                        >
                            This is an automated email from the
                            Cloud Energy Solar Assessment Platform.
                        </p>

                    </td>
                </tr>

            </table>

        </td>
    </tr>
</table>

</body>
</html>
