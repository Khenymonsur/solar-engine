<div class="card shadow-sm {{ card_class|default:'' }}">

    {% if title or header_actions %}

    <div class="card-header d-flex justify-content-between align-items-center">

        <h5 class="mb-0">

            {% if icon %}

                <i class="{{ icon }} me-2"></i>

            {% endif %}

            {{ title }}

        </h5>

        {% if header_actions %}

            {{ header_actions|safe }}

        {% endif %}

    </div>

    {% endif %}

    <div class="card-body">

        {{ body|safe }}

    </div>

    {% if footer %}

    <div class="card-footer">

        {{ footer|safe }}

    </div>

    {% endif %}

</div>
