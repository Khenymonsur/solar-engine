<div class="card shadow-sm border-0 h-100">

    <div class="card-body">

        {% if icon %}

            <i class="{{ icon }} fs-4 text-primary mb-2"></i>

        {% endif %}

        <div class="text-muted small">

            {{ title }}

        </div>

        <h2 class="fw-bold mb-0">

            {{ value|default:"0" }}

        </h2>

    </div>

</div>
