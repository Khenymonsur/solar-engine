<div class="text-center py-5">

    <i class="{{ icon|default:'bi bi-inbox' }} display-4 text-muted"></i>

    <h5 class="mt-3">

        {{ title }}

    </h5>

    <p class="text-muted">

        {{ message }}

    </p>

    {% if action_url %}

    <a href="{{ action_url }}"
       class="btn btn-primary">

        {{ action_text }}

    </a>

    {% endif %}

</div>
